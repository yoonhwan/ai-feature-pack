[project]
name = "ai-feature-rag"
version = "0.1.0"
description = "airag — reusable encrypted local RAG engine (phase 1: install + encryption/vector verification)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "docling-core[chunking]>=2.95.0",
    "sqlcipher3==0.6.2",
    "sqlite-vec>=0.1.9",
    "marko==2.2.4",
]

[project.optional-dependencies]
documents = [
    "docling==2.126.0",
    "easyocr==1.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airag"]

[project.scripts]
ai-rag = "airag.cli.main:main"
krb-rag = "airag.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=4.4.0",
]

[tool.uv]
required-version = ">=0.10.0"

[tool.pytest.ini_options]
# Default `pytest` run SKIPS integration tests (addopts) — registering the
# marker alone does not skip anything by itself. To run them explicitly:
#   .venv/bin/python -m pytest -m integration          # integration only
#   .venv/bin/python -m pytest -m ""                   # everything, no filter
addopts = "-m 'not integration'"
markers = [
    "integration: uses live model providers or tokenizer downloads; GPU pipeline tests require configured BYZ endpoints and AIRAG_EMBED_REVISION; run explicitly with -m integration or -m ''",
]
