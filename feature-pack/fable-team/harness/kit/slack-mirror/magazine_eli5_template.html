<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>아침 매거진 $date — 쉬운 판</title>
  <style>
    :root{color-scheme:light;--paper:#f7f4ec;--ink:#253e35;--muted:#67736b;--line:#d9ded2;--peach:#f4dfc9}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.65}
    main{max-width:1100px;margin:0 auto;padding:28px 36px 36px}
    .masthead{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--ink);padding-bottom:12px;font-size:12px;letter-spacing:.1em}
    .brand{font-weight:750}.edition{color:var(--muted);text-align:right;letter-spacing:0}
    header{padding:25px 0 22px}h1{margin:0;font-size:clamp(32px,4vw,46px);line-height:1.18;letter-spacing:-.05em}
    .intro{margin:9px 0 0;color:var(--muted);font-size:14px}.summary{margin:12px 0 0;font-size:14px;font-weight:650}
    h2{margin:0;font-size:20px;letter-spacing:-.03em}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
    .section-label{color:var(--muted);font-size:11px;letter-spacing:.1em}
    .decision-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
    .decision{border:1px solid var(--line);border-radius:14px;background:#fffdf8;padding:18px 22px;overflow-wrap:anywhere}
    .decision.pending{background:var(--peach);border-color:#e7ccb0}.decision h3{font-size:16px;margin:0 0 9px}
    .decision ul{padding-left:18px;margin:0}.decision li,.decision p{font-size:14px;margin:5px 0}
    .decision-label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
    #units{margin-top:30px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .unit-card{background:#fffdf8;border:1px solid var(--line);border-radius:17px;padding:24px;overflow-wrap:anywhere}
    .chips{display:flex;flex-wrap:wrap;gap:6px;font-size:11px}.chips span{background:#ecf0e6;border-radius:5px;padding:2px 7px}
    .chips .evidence{background:transparent;color:var(--muted);font-family:ui-monospace,monospace}
    .unit-card h3{font-size:23px;line-height:1.35;letter-spacing:-.035em;margin:14px 0}
    .source{border-left:2px solid #bac9b5;padding-left:12px;font-size:13px}.source span{font-size:10px;color:var(--muted)}
    .source p{margin:3px 0 0}.ai-explanation{margin-top:18px;padding:17px;background:#f0f3ed;border-radius:11px;font-style:italic}
    .ai-heading{display:flex;align-items:center;gap:11px;font-style:normal;color:var(--muted);font-size:11px;line-height:1.4}
    .icon{font-size:34px;line-height:1.3}.analogy{font-size:17px;font-weight:650;margin:10px 0 8px;letter-spacing:-.02em}
    .explanation-line{font-size:14px;margin:3px 0}.empty{color:var(--muted)}
    .omitted{display:inline-block;background:#eceeea;color:#657067;border-radius:6px;padding:5px 9px;font-size:12px}.stats{margin:26px 0 0;font-size:13px;font-weight:600}
    .notice{border-top:1px solid var(--line);padding-top:17px;margin:28px 0 24px;color:var(--muted);font-size:12px}
    #footnotes h2{font-size:16px;margin-bottom:10px}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px;text-align:left}
    th,td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}th{color:var(--muted);font-weight:500}
    th:first-child{width:15%}th:nth-child(2){width:14%}th:last-child{width:20%}
    @media(max-width:600px){main{padding:17px 18px 24px}.masthead{font-size:10px}header{padding:20px 0}.intro,.summary{font-size:12px}
      .decision-grid{gap:9px}.decision{padding:13px 12px;border-radius:11px}.decision h3{font-size:14px}.decision li,.decision p{font-size:12px}
      .cards{grid-template-columns:minmax(0,1fr);gap:14px}.unit-card{padding:20px}.unit-card h3{font-size:21px}h2{font-size:18px}
      #units{margin-top:24px}.section-label{font-size:9px}.notice{font-size:11px}th,td{padding:8px 5px;font-size:11px}}
    @media print{body{background:white}main{max-width:none;padding:0}.unit-card,.decision{break-inside:avoid}.cards{grid-template-columns:minmax(0,1fr)}}
  </style>
</head>
<body>
  <main>
    <div class="masthead"><span class="brand">BYZ · MORNING DESK</span><span class="edition">$date / 쉬운 판</span></div>
    <header>
      <h1>아침을 여는<br>작은 작업 지도</h1>
      <p class="intro">먼저 결정할 일, 그다음 오늘의 변화.</p>
      <p class="summary">$headline</p>
    </header>
    <section id="decisions" aria-labelledby="decisions-title">
      <div class="section-heading"><h2 id="decisions-title">오늘의 결정사항</h2><span class="section-label">먼저 살펴봐요</span></div>
      <div class="decision-grid">
        <article class="decision pending"><span class="decision-label">답을 기다려요</span><h3>오빠 몫</h3>$hil</article>
        <article class="decision"><span class="decision-label">원문에 적힌 판정</span><h3>이미 결정된 것</h3>$decided</article>
      </div>
    </section>
    <section id="units" aria-labelledby="units-title">
      <div class="section-heading"><h2 id="units-title">단위별 그림 설명</h2><span class="section-label">원문 + AI 풀이</span></div>
      <div class="cards">$cards</div>
    </section>
    <p class="stats" id="eli5-stats">$stats</p>
    <p class="notice">AI 풀이는 형식만 검사했어요 · 결정·상태는 PDF·원문이 정본</p>
    <section id="footnotes" aria-labelledby="footnotes-title"><h2 id="footnotes-title">번호 각주표</h2>$footnotes</section>
  </main>
</body>
</html>
