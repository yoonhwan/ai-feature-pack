<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--bg:#fbfaf7;--fg:#1d1d1b;--mute:#6b6a65;--line:#e4e1d9;--accent:#b4441f;--chip:#f1ede4;--ok:#2f7d4f;--warn:#a86412}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#ecebe6;--mute:#a19f98;--line:#2e2e33;--accent:#ff8a5c;--chip:#232328;--ok:#6fcf97;--warn:#f2b45a}}
:root[data-theme="dark"]{--bg:#17171a;--fg:#ecebe6;--mute:#a19f98;--line:#2e2e33;--accent:#ff8a5c;--chip:#232328;--ok:#6fcf97;--warn:#f2b45a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 -apple-system,"Apple SD Gothic Neo","Pretendard",sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 64px}
.date{color:var(--mute);font-size:14px;letter-spacing:.02em}
h1{font-size:24px;line-height:1.4;margin:6px 0 22px}
h2{font-size:15px;color:var(--accent);margin:34px 0 10px;letter-spacing:.03em}
ol,ul{padding-left:22px;margin:0}
li{margin:6px 0}
.grp{margin:16px 0 4px;font-weight:600}
.todo li::marker{color:var(--accent);font-weight:700}
.cmd{font-family:ui-monospace,Menlo,monospace;background:var(--chip);padding:1px 6px;border-radius:4px;font-size:14px}
.risk{border-left:3px solid var(--warn);padding:8px 12px;background:var(--chip);border-radius:0 6px 6px 0;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:13px}
.ok{color:var(--ok)} .wait{color:var(--warn)} .mute{color:var(--mute)}
.more{color:var(--mute);font-size:14px;margin-top:8px}
.cheer{font-size:18px;font-weight:700;margin:4px 0 14px}
.done{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0}
.done h3{font-size:16px;margin:0 0 6px} .done .chip{color:var(--mute);font-size:12px;margin:0 0 2px} .done p{margin:4px 0}
.eli5{background:var(--chip);border-radius:6px;padding:8px 12px;margin-top:8px}
.analogy{font-weight:600} .fact{color:var(--mute);font-size:13px} .eli5-fail{color:var(--warn);font-weight:600}
.part{margin:40px 0 0;padding-top:16px;border-top:2px solid var(--line);color:var(--mute);font-size:14px}
footer{margin-top:44px;border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--mute)}
footer table{font-size:13px} footer td,footer th{padding:5px 4px}
</style>
</head>
<body>
<main>
{{BODY}}
</main>
</body>
</html>
